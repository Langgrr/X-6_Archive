    <style>
        :root {
            --bg-deep: #09050e;
            --os-window: #130b1b;
            --border-dim: #5a2e6b;
            --accent-purple: #c25eff;
            --accent-glow: rgba(194, 94, 255, 0.35);
            --text-main: #e4d4f4;
            --text-dim: #9a82b0;
            --card-bg: #100818;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        *::-webkit-scrollbar {
            width: 10px;
        }
        *::-webkit-scrollbar-track {
            background: #08030d;
            border: 1px solid var(--border-dim);
        }
        *::-webkit-scrollbar-thumb {
            background: var(--border-dim);
            border: 1px solid var(--accent-purple);
            box-shadow: 0 0 6px rgba(194, 94, 255, 0.3);
        }
        *::-webkit-scrollbar-thumb:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 10px var(--accent-purple);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--accent-purple) #08030d;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        radial-gradient(circle, rgba(0,0,0,0) 55%, rgba(10,3,18,0.85) 100%);
            background-size: 100% 3px, 100% 100%;
            z-index: 999;
            pointer-events: none;
        }

        .os-container {
            width: 100%;
            max-width: 1280px;
            background: var(--os-window);
            border: 2px solid var(--accent-purple);
            box-shadow: 0 0 35px var(--accent-glow), inset 0 0 25px rgba(0,0,0,0.95);
            position: relative;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .window-header {
            background: #1b1026;
            padding: 12px 20px;
            border-bottom: 2px solid var(--accent-purple);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .window-title {
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            color: var(--accent-purple);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 8px rgba(194, 94, 255, 0.4);
        }

        .window-title::before {
            content: "●";
            font-size: 0.8rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.2; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--accent-purple); }
            100% { opacity: 0.2; }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-clock {
            font-family: 'VT323', monospace;
            font-size: 1.3rem;
            color: var(--text-main);
            background: #0d0714;
            padding: 2px 10px;
            border: 1px solid var(--border-dim);
        }

        .hero-banner {
            padding: 35px 30px 25px 30px;
            border-bottom: 2px dashed var(--border-dim);
            background: #0d0714;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .hero-text h1 {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            color: var(--accent-purple);
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(194, 94, 255, 0.4);
            line-height: 1;
        }

        .hero-text p {
            color: var(--text-dim);
            font-size: 1.05rem;
            margin-top: 8px;
        }

        /* Container tombol disesuaikan agar posisinya berada di tengah secara vertikal */
        .hero-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-cyber {
            background: #150921;
            border: 1px solid var(--accent-purple);
            color: var(--accent-purple);
            font-family: 'VT323', monospace;
            font-size: 1.35rem;
            padding: 10px 32px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 0 10px rgba(194, 94, 255, 0.2);
            transition: color 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        letter-spacing 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                        background-color 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-cyber::before {
            content: "";
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(
                90deg, 
                transparent 0%, 
                rgba(194, 94, 255, 0.3) 50%, 
                var(--accent-purple) 75%, 
                transparent 100%
            );
            z-index: -1;
            transition: left 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-cyber::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(194, 94, 255, 0.15);
            opacity: 0;
            z-index: -2;
            transition: opacity 0.7s ease;
        }

        .btn-cyber:hover {
            color: #ffffff;
            border-color: #e4d4f4;
            letter-spacing: 1.8px;
            transform: translateY(-1px) scale(1.005);
            box-shadow: 0 0 20px var(--accent-purple), 0 0 35px rgba(194, 94, 255, 0.25), inset 0 0 12px rgba(194, 94, 255, 0.35);
            text-shadow: 0 0 8px #ffffff, 0 0 12px var(--accent-purple);
        }

        .btn-cyber:hover::before {
            left: 100%;
        }

        .btn-cyber:hover::after {
            opacity: 1;
        }

        .btn-cyber .arrow-icon {
            display: inline-block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-cyber .arrow-up {
            animation: bounceArrowUp 2.5s infinite ease-in-out;
        }

        @keyframes bounceArrowUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .btn-cyber:hover .arrow-up {
            animation: none;
            transform: translateY(-4px) scale(1.08);
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff;
        }

        .btn-cyber:active {
            transform: translateY(0) scale(0.995);
            transition: transform 0.1s ease;
        }

        .os-content {
            padding: 30px;
        }

        .flex-grid-5 {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .blog-card-wrapper {
            display: flex;
            width: calc((100% - (15px * 4)) / 5);
            min-width: 220px;
        }

        .blog-card {
            background: var(--card-bg);
            border: 1px solid var(--border-dim);
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
            width: 100%;
        }

        .blog-card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-4px);
            box-shadow: 0 0 18px rgba(194, 94, 255, 0.25);
        }

        .card-thumb {
            width: 100%;
            height: 130px;
            background: #08030d;
            border: 1px solid var(--border-dim);
            margin-bottom: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 3px;

            clip-path: polygon(
                0 0, 
                calc(100% - 10px) 0, 100% 10px, 
                100% 100%, 
                10px 100%, 0 calc(100% - 10px)
            );
            transition: all 0.4s ease;
        }

        .card-thumb::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(194, 94, 255, 0.15) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%) contrast(110%);
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .blog-card:hover .card-thumb {
            border-color: var(--accent-purple);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .blog-card:hover .card-thumb img {
            transform: scale(1.12);
            filter: grayscale(0%) contrast(100%);
        }

        .blog-card:hover .card-thumb::after {
            opacity: 0.2;
        }

        .card-title {
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-dim);
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .card-tag {
            font-family: 'VT323', monospace;
            font-size: 0.95rem;
            color: var(--accent-purple);
            background: #08030d;
            border: 1px solid var(--border-dim);
            padding: 2px 6px;
            display: inline-block;
            margin-bottom: 12px;
            width: fit-content;
        }

        .card-meta {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(90, 46, 107, 0.5);
            width: 100%;
        }

        .card-link-btn {
            text-decoration: none;
            display: block;
            width: 100%;
        }

        .card-link-text {
            color: var(--accent-purple);
            background: #08030d;
            border: 1px solid var(--border-dim);
            font-family: 'VT323', monospace;
            font-size: 1.15rem;
            letter-spacing: 1px;
            text-align: center;
            display: block;
            width: 100%;
            padding: 6px 0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card-link-btn:hover .card-link-text {
            color: #ffffff;
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            box-shadow: 0 0 12px var(--accent-purple);
            text-shadow: 0 0 5px #ffffff;
        }

        @media(max-width: 1200px) {
            .blog-card-wrapper {
                width: calc((100% - (15px * 3)) / 4);
            }
        }

        @media(max-width: 992px) {
            .blog-card-wrapper {
                width: calc((100% - (15px * 2)) / 3);
            }
        }

        @media(max-width: 768px) {
            .blog-card-wrapper {
                width: calc((100% - 15px) / 2);
            }
            .hero-banner { flex-direction: column; align-items: flex-start; }
            .hero-text h1 { font-size: 2.5rem; }
            .hero-buttons { width: 100%; }
            .btn-cyber { max-width: 100%; }
        }

        @media(max-width: 520px) {
            .blog-card-wrapper {
                width: 100%;
            }
            .os-content { padding: 15px; }
        }
    </style>
</head>

        function createCardHTML(item) {
            const thumbnailHTML = item.thumb ? `<img src="${item.thumb}" alt="">` : '';

            return `
                <div class="blog-card-wrapper">
                    <article class="blog-card">
                        <div>
                            <div class="card-thumb">
                                ${thumbnailHTML}
                            </div>
                            <h3 class="card-title">${item.title}</h3>
                            <p class="card-desc">${item.desc}</p>
                            <span class="card-tag">[ ${item.tag} ]</span>
                        </div>
                        <div class="card-meta">
                            <a href="${item.url}" class="card-link-btn">
                                <span class="card-link-text">[ READ_LOG ]</span>
                            </a>
                        </div>
                    </article>
                </div>
            `;
        }

        function renderMainList(items) {
            document.getElementById('mainGrid').innerHTML = items.map(createCardHTML).join('');
        }

        function updateHeaderClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const clockEl = document.getElementById('headerClock');
            if (clockEl) clockEl.innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateHeaderClock, 1000);

        document.addEventListener('DOMContentLoaded', () => {
            window.scrollTo(0, 0);
            updateHeaderClock();
            renderMainList(articles);
        });
    </script>
</body>
